name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/docs.yml'

jobs:
  build:
    strategy:
      matrix:
        node-version: [22, 24]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' || matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build workspace (needed for tests)
        run: pnpm -r build

      - name: Unit tests
        run: pnpm -r --filter !@mineproj/e2e test

      - name: Contract tests
        run: pnpm --filter @mineproj/contract-tests test

      - name: Build example site
        run: pnpm --filter @mineproj/e2e build

      - name: Install Playwright
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @mineproj/e2e exec playwright install --with-deps chromium

      - name: E2E tests
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @mineproj/e2e test:e2e

      - name: Audit
        if: matrix.os == 'ubuntu-latest'
        run: node packages/cli/dist/cli.js audit --root examples/basic