name: Bug report
description: 报告一个缺陷
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢反馈！请尽量提供可复现的信息，帮助维护者快速定位。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 清晰、简洁地描述缺陷现象。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步步操作以复现该问题。
      placeholder: |
        1. 运行 `mineproj dev`
        2. 打开 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mineproj 版本 / Commit
  - type: input
    id: environment
    attributes:
      label: 环境
      description: Node 版本、OS、浏览器（如适用）
