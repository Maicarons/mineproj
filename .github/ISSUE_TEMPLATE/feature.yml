name: Feature request
description: 提出一个新功能或改进建议
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个需求来自什么痛点？（也可链接到对应里程碑 M*）
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望如何被解决？涉及哪个包 / 模块？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: checkboxes
    id: impact
    attributes:
      label: 影响范围
      options:
        - label: 影响默认主题 @mineproj/theme-classic
        - label: 影响内核 / CLI
        - label: 影响 i18n
        - label: 影响 SEO / AI 友好
        - label: 影响可视化编辑器
